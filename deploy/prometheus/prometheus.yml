# ============================================================
# SRM Credit Engine — Configuração do Prometheus
# Coleta as métricas /actuator/prometheus de cada serviço
# (expostas nas portas mapeadas para o host).
# ============================================================
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: srm-services
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - host.docker.internal:8080 # gateway-service
          - host.docker.internal:8081 # auth-service
          - host.docker.internal:8082 # currency-service
          - host.docker.internal:8083 # credit-service
          - host.docker.internal:8084 # analytics-service
        labels:
          env: local
