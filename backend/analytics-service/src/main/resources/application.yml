spring:
  application:
    name: analytics-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/srm_credit_engine}
    username: ${SPRING_DATASOURCE_USERNAME:srm_user}
    password: ${SPRING_DATASOURCE_PASSWORD:srm_pass_2026}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  flyway:
    enabled: true
    default-schema: analytics
    create-schemas: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: analytics-projection
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      auto-offset-reset: earliest
      properties:
        interceptor.classes: com.srm.common.correlation.CorrelationIdKafkaInterceptor
        spring.json.trusted.packages: com.srm.common.event
        spring.json.value.default.type: com.srm.common.event.SettlementEvent

app:
  kafka:
    consumer-group: analytics-projection

server:
  port: ${PORT:8080}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
