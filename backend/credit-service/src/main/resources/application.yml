spring:
  application:
    name: credit-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/srm_credit_engine}
    username: ${SPRING_DATASOURCE_USERNAME:srm_user}
    password: ${SPRING_DATASOURCE_PASSWORD:srm_pass_2026}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    default-schema: credit
    create-schemas: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        interceptor.classes: com.srm.common.correlation.CorrelationIdKafkaInterceptor
        spring.json.add.type.headers: true

app:
  fx:
    service-url: ${CURRENCY_SERVICE_URI:http://currency-service:8080}

# Resiliência da chamada externa ao currency-service (RNF01):
# retry com backoff, circuit breaker e fallback para a última taxa conhecida.
resilience4j:
  circuitbreaker:
    instances:
      fxRate:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        # Erros de negócio (ex.: par inexistente) não contam como falha do circuito
        ignore-exceptions:
          - com.srm.common.error.BusinessException
  retry:
    instances:
      fxRate:
        max-attempts: 3
        wait-duration: 300ms
        retry-exceptions:
          - org.springframework.web.client.RestClientException
        ignore-exceptions:
          - com.srm.common.error.BusinessException

server:
  port: ${PORT:8080}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    # Agregação via gateway (RF04): a UI carrega o spec pelo caminho público /swagger/credit-service
    url: /swagger/credit-service/v3/api-docs
    # "Try it out" atinge o gateway: OpenApiGatewayServerAutoConfiguration força servers=[/]

management:
  # Boot 4.1: a autoconfiguração de tracing OTel só roda com esta flag explícita
  opentelemetry:
    enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://jaeger:4318}
