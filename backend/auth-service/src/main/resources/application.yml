spring:
  application:
    name: auth-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/srm_credit_engine}
    username: ${SPRING_DATASOURCE_USERNAME:srm_user}
    password: ${SPRING_DATASOURCE_PASSWORD:srm_pass_2026}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    default-schema: auth
    create-schemas: true
    locations: classpath:db/migration

app:
  jwt:
    secret: ${JWT_SECRET:c2VjdXJlLWRldi1zZWNyZXQtY2hhbmdlLW1lLWluLXByb2R1Y3Rpb24tMjAyNi1zcm0tc3Jt}
    issuer: ${JWT_ISSUER:https://srm-credit-engine}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:480}
  seed:
    admin:
      username: ${SEED_ADMIN_USERNAME:admin}
      password: ${SEED_ADMIN_PASSWORD:Admin@123}
    manager:
      username: ${SEED_MANAGER_USERNAME:manager}
      password: ${SEED_MANAGER_PASSWORD:Manager@123}
    operator:
      username: ${SEED_OPERATOR_USERNAME:operator}
      password: ${SEED_OPERATOR_PASSWORD:Operator@123}

server:
  port: ${PORT:8080}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    # Agregação via gateway (RF04): a UI carrega o spec pelo caminho público /swagger/auth-service
    url: /swagger/auth-service/v3/api-docs
    # "Try it out" atinge o gateway: OpenApiGatewayServerAutoConfiguration força servers=[/]

management:
  # Boot 4.1: a autoconfiguração de tracing OTel só roda com esta flag explícita
  opentelemetry:
    enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://jaeger:4318}
