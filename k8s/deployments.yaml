# Deployments dos microserviços (Seção 9.2 da especificação).
# Imagens: srm/{service}:1.0.0 (construídas com backend/Dockerfile / frontend/Dockerfile).
# Probes: liveness/readiness em /actuator/health/liveness e /actuator/health/readiness.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: srm-credit-engine
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
        - name: auth-service
          image: srm/auth-service:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: srm-common-config
            - secretRef:
                name: srm-secrets
          env:
            - name: OTEL_SERVICE_NAME
              value: auth-service
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests:
              memory: "384Mi"
              cpu: "300m"
            limits:
              memory: "768Mi"
              cpu: "1000m"
