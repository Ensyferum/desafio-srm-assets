# Entrada externa: frontend em / e API via gateway (prefixo /api e /swagger).
# Requer um Ingress Controller instalado no cluster (nginx, traefik, etc.).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: srm-ingress
  namespace: srm-credit-engine
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
spec:
  ingressClassName: nginx
  rules:
    - host: srm.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: gateway-service
                port:
                  number: 8080
          - path: /swagger
            pathType: Prefix
            backend:
              service:
                name: gateway-service
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
