# SECRET (NÃO COMMITAR VALORES REAIS)
#
# Copie para secret.yaml, ajuste os valores base64 e aplique:
#   kubectl create namespace srm-credit-engine 2>/dev/null || true
#   kubectl apply -k k8s/        # ou: kubectl apply -f k8s/secret.yaml
#
# Gere valores com: echo -n 'valor' | base64
apiVersion: v1
kind: Secret
metadata:
  name: srm-secrets
  namespace: srm-credit-engine
type: Opaque
stringData:
  # Troque pelos valores do seu ambiente (stringData aceita texto puro — o k8s codifica)
  SPRING_DATASOURCE_PASSWORD: srm_pass_2026
  # JWT_SECRET base64url: c2VjdXJlLWRldi1zZWNyZXQtY2hhbmdlLW1lLWluLXByb2R1Y3Rpb24tMjAyNi1zcm0tc3Jt
  JWT_SECRET: c2VjdXJlLWRldi1zZWNyZXQtY2hhbmdlLW1lLWluLXByb2R1Y3Rpb24tMjAyNi1zcm0tc3Jt
  JWT_ISSUER: https://srm-credit-engine
  # Credenciais seed (usuários iniciais)
  SEED_ADMIN_USERNAME: admin
  SEED_ADMIN_PASSWORD: Admin@123
  SEED_MANAGER_USERNAME: manager
  SEED_MANAGER_PASSWORD: Manager@123
  SEED_OPERATOR_USERNAME: operator
  SEED_OPERATOR_PASSWORD: Operator@123
